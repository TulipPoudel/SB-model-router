# !!! These values are my best recollection and are UNVERIFIED. Before running the analysis:
#   1. open each provider's pricing page, 2. update the numbers, 3. fill pricing_source and
#   pricing_checked_at with the date (YYYY-MM-DD). The code prints a warning while it says UNVERIFIED.
pricing_checked_at: "2026-11-15"
pricing_source: "https://groq.com/pricing ; https://ai.google.dev/gemini-api/docs/pricing"  
actual_expenditure_usd: 0.0  
prices_usd_per_million_tokens:
  openai/gpt-oss-20b:  {input: 0.075, output: 0.30}
  gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
  gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
  openai/gpt-oss-120b: {input: 0.15,  output: 0.60}